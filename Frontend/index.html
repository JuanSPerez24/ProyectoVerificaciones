<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid shadow p-3 mb-2 bg-body-tertiary rounded justify-content-center">
                <h1 class="navbar-brand fw-semibold fs-2" href="#">Marcas en verificación</h1>
            </div>
        </nav>
    </header>

    <main>
        <section class="container-fluid d-flex justify-content-center align-items-center my-5">
            <img src="assets/Imagenes/Fondo.jpeg" class="position-fixed top-0 start-0 w-100 h-100" 
                style="object-fit: cover; object-position: center; opacity: 0.25; z-index: -1;" alt="Fondo">
            <div class="bg-dark text-white bg-opacity-25 p-3 rounded-4 w-100 w-md-75 w-lg-50 w-xl-40 w-xxl-30" style="max-width: 600px;">
                <div class="bg-dark text-white bg-opacity-80 p-4 rounded-2">
                    <form class="mx-5 mx-sm-4 mx-md-5">
                        <h3 class="text-center mb-4">Iniciar sesión</h3>
                        <div class="mb-2">
                            <label for="InputUser" class="form-label">Usuario:</label>
                            <input type="text" class="form-control" id="InputUser" aria-describedby="usuario">
                        </div>
                        <div class="mb-4">
                            <label for="InputPassword" class="form-label">Contraseña:</label>
                            <input type="password" class="form-control" id="InputPassword">
                        </div>
                        <div class="d-flex justify-content-center">
                            <a type="submit" class="btn btn-outline-success w-75 w-md-50 w-lg-25" id="ButtonIngreso">Ingresar</a>
                        </div>
                    </form>
                </div>
            </div>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script type="module" src="JS/config.js"></script>
    <script type="module" src="JS/Ingresar.js"></script>
</body>

</html>
