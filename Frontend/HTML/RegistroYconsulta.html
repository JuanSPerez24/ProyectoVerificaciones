<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <metaiewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid shadow p-3 mb-2 bg-body-tertiary rounded justify-content-center">
            <a class="navbar-brand" href="/HTML/RegistroYconsulta.html">Logo</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="/Frontend/HTML/RegistroYconsulta.html">Nuevo
                            registro</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/Frontend/HTML/Buscar.html">Busqueda</a>
                    </li>
                </ul>
                <a class="navbar-text" href="/Frontend/index.html"> Cerrar sesión </a>
            </div>
            <h1 class="position-absolute start-50 translate-middle-x fw-semibold fs-2 m-0 d-none d-lg-block"
                style="z-index: 1">
                Marcas en verificación
            </h1>
        </div>
    </nav>
    <main>
        <div class="position-absolute top-0 start-0 w-100 min-vh-100 opacity-25"
            style="object-fit: cover; z-index: -1;">
            <img src="/assets/Imagenes/Fondo.jpeg" class="w-100 h-100" alt="Fondo">
        </div>
        <!--Secciones formulario-->
        <section>
            <div class="card bg-dark bg-opacity-25 rounded-4 rounded-bottom-0">
                <div class="bg-dark bg-opacity-80 rounded-4 rounded-bottom-0 mt-3">
                    <div class="btn-group w-100 mt-3" role="group">

                        <input type="radio" class="btn-check" name="bntradio" id="btnradio1" autocomplete="off" checked
                            onclick='
                            document.getElementById("PrimeraEtapa").style.display="block"
                            document.getElementById("SegundaEtapa").style.display="none"
                            document.getElementById("TerceraEtapa").style.display="none"' />
                        <label class="btn btn-outline-success rounded-bottom-0" for="btnradio1">
                            Primera etapa
                        </label>

                        <input type="radio" class="btn-check" name="bntradio" id="btnradio2" autocomplete="off" onclick='
                            document.getElementById("PrimeraEtapa").style.display="none"
                            document.getElementById("SegundaEtapa").style.display="block"
                            document.getElementById("TerceraEtapa").style.display="none"' />
                        <label class="btn btn-outline-warning" for="btnradio2">
                            Segunda etapa
                        </label>

                        <input type="radio" class="btn-check" name="bntradio" id="btnradio3" autocomplete="off" onclick='
                            document.getElementById("PrimeraEtapa").style.display="none"
                            document.getElementById("SegundaEtapa").style.display="none"
                            document.getElementById("TerceraEtapa").style.display="block"' />
                        <label class="btn btn-outline-info rounded-bottom-0" for="btnradio3">
                            Tercera etapa
                        </label>
                    </div>
                </div>
            </div>
        </section>
        <!--Primera etapa-->
        <section style="display: block" id="PrimeraEtapa">
            <!--TituloPrimeraEtapa-->
            <div class="card bg-dark bg-opacity-25 rounded-4 rounded-top-0">
                <div class="bg-dark bg-opacity-80 rounded-4 rounded-top-0 mb-3">
                    <div
                        class="card text-center text-white fw-semibold fs-4 bg-success rounded-3 rounded-top-0 p-1 w-100 border-5 border-success mb-3">
                        Primera etapa
                    </div>
                </div>
            </div>
            <!--FormularioPrimeraEtapa-->
            <form id="FormularioPrimeraEtapa" class="container-fluids" action="">
                <!--Gurpo Ficha y BotonConsultar, BotonLimpiar-->
                <!--FechaPrimeraEtapa-->
                <div class="card bg-dark text-white bg-opacity-25 rounded-4 m-2">
                    <div class="card bg-dark text-white bg-opacity-80 rounded-3 m-3">
                        <div class="row">
                            <!--Gurpo Ficha y BotonConsultar, BotonLimpiar-->
                            <div class="ms-4 mb-3 me-2 col">
                                <label for="TextFichaPrimeraEtapa" class="form-label mb-0">Ficha:</label>
                                <div class="input-group">
                                    <input id="TextFichaPrimeraEtapa" type="number" class="form-control"
                                        placeholder="FICHA" />
                                    <button class="btn btn-danger" type="button" id="button-addon2">
                                        Consultar
                                    </button>
                                </div>

                                <button class="btn btn-outline-info mt-2">
                                    Limpiar formulario
                                </button>
                            </div>
                            <!--FechaPrimeraEtapa-->
                            <div class="ms-2 mb-3 me-4 col">
                                <label for="FechaPrimeraEtapa" class="form-labels">Fecha:</label>
                                <input id="FechaPrimeraEtapa" type="date" class="form-control" />
                            </div>

                        </div>
                    </div>
                </div>
                <!--Hogar, Orden, Tipo documento, Numero documento, Celular, CelularOpcional, Correo-->
                <!--Informador, PuntoDeAtención-->
                <div class="row m-2">
                    <!--Hogar, Orden, Tipo documento, Numero documento-->
                    <!--Celular, CelularOpcional, Correo-->
                    <div class="card col bg-dark text-white bg-opacity-25 rounded-4 me-1">
                        <div class="card bg-dark text-white bg-opacity-80 rounded-3 mx-1 my-3">
                            <!--Hogar, Orden, Tipo documento, Numero documento-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <!--Hogar-->
                                <div class="col">
                                    <label for="SelectHogar">Hogar:</label>
                                    <select id="SelectHogar" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <!--Orden-->
                                <div class="col">
                                    <label for="SelectOrden">Orden:</label>
                                    <select id="SelectOrden" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <!--Tipo documento-->
                                <div class="col">
                                    <label for="TipoDocumento">Tipo documento:</label>
                                    <select id="TipoDocumento" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <!--Numero documento-->
                                <div class="col">
                                    <label for="InputNumeroDocumento">Numero documento:</label>
                                    <input id="InputNumeroDocumento" type="number" class="form-control"
                                        placeholder="1234567890" />
                                </div>
                            </div>
                            <!--Celular, CelularOpcional, Correo-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <!--Celular-->
                                <div class="col">
                                    <label for="InputCelular">Celular:</label>
                                    <input id="InputCelular" type="number" class="form-control"
                                        placeholder="3123456789" />
                                </div>
                                <!--CelularOpcional-->
                                <div class="col">
                                    <label for="InputCelularOpcional">Celular opcional:</label>
                                    <input id="InputCelularOpcional" type="number" class="form-control"
                                        placeholder="3123456789" />
                                </div>
                                <!--Correo-->
                                <div class="col-6">
                                    <label for="InputCorreo">Correo:</label>
                                    <input id="InputCorreo" type="email" class="form-control"
                                        placeholder="example@gmail.com" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--Informador, PuntoDeAtención-->
                    <div class="card col bg-dark text-white bg-opacity-25 rounded-4 ms-1">
                        <div class="card bg-dark text-white bg-opacity-80 rounded-3 mx-1 my-3">
                            <!--Informador-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <div class="col">
                                    <label for="SelectInformador">Informador:</label>
                                    <select id="SelectInformador" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                            </div>
                            <!--PuntoDeAtención-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <div class="col">
                                    <label for="SelectPuntoAtencion">Punto de atención:</label>
                                    <select id="SelectPuntoAtencion" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <!--Codigo verificación, Tipologias, Descripcción trámite-->
                <div class="row m-2">
                    <div class="card col bg-dark text-white bg-opacity-25 rounded-4 me-1">
                        <div class="card bg-dark text-white bg-opacity-80 rounded-3 mx-1 my-3">
                            <!--Codigo verificación-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <div class="col">
                                    <label for="InputCodigoVerificacion">Codigo verificación:</label>
                                    <select name="" id="InputCodigoVerificacion" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                            </div>
                            <!--Tipologias-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <div class="col">
                                    <label for="SelectTipologia1">Tipologia 1:</label>
                                    <select name="" id="SelectTipologia1" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label for="SelectTipologia2">Tipologia 2:</label>
                                    <select name="" id="SelectTipologia1" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <label for="SelectTipologia3">Tipologia 3:</label>
                                    <select name="" id="SelectTipologia1" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                            </div>
                            <!--Descripcción trámite-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <div class="col">
                                    <label for="InputDescripcionPrimeraEtapa">Codigo verificación:</label>
                                    <textarea name="" id="InputDescripcionPrimeraEtapa" class="form-control"
                                        placeholder="DE UNA BREVE DESCRIPCIÓN DEL TRÁMITE"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--BotonGuardarSolicitud-->
                <div class="row m-2">
                    <div class="card col bg-dark text-white bg-opacity-25 rounded-4 me-1">
                        <div class="card bg-dark text-white bg-opacity-80 rounded-3 mx-1 my-3">
                            <div class="row m-2">
                                <div class="col d-flex justify-content-center">
                                    <a href="" class="btn btn-success">Guardar solicitud</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </section>
        <!--Segunda etapa-->
        <section style="display: none" id="SegundaEtapa">
            <!--TituloSegundaEtapa-->
            <div class="card bg-dark bg-opacity-25 rounded-4 rounded-top-0">
                <div class="bg-dark bg-opacity-80 rounded-4 rounded-top-0 mb-3">
                    <div
                        class="card text-center text-white fw-semibold fs-4 bg-warning rounded-3 rounded-top-0 p-1 w-100 border-5 border-warning mb-3">
                        Segunda etapa
                    </div>
                </div>
            </div>
            <form id="FormularioPrimeraEtapa" class="container-fluids" action="">
                <!--RespuestaLevantamiento, FechaSegundaEtapa-->
                <!--FechaSegundaEtapa-->
                <div class="card bg-dark text-white bg-opacity-25 rounded-4 m-2">
                    <div class="card bg-dark text-white bg-opacity-80 rounded-3 m-3">
                        <div class="row">
                            <!--RespuestaLevantamiento, FechaSegundaEtapa-->
                            <div class="col m-3">
                                <label for="SelectRespuestaLevantamiento" class="form-label mb-0">¿Se realiza el
                                    levantamiento?:</label>
                                <select class="form-select" id="SelectRespuestaLevantamiento">
                                    <option value="">--Seleccione--</option>
                                </select>
                            </div>
                            <!--FechaSegundaEtapa-->
                            <div class="col m-3">
                                <label for="FechaSegundaEtapa" class="form-labels">Fecha:</label>
                                <input id="InputFechaSegundaEtapa" type="date" class="form-control" />
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card bg-dark text-white bg-opacity-25 rounded-4 m-2">
                    <div class="card bg-dark text-white bg-opacity-80 rounded-3 m-3">
                        <div class="row">
                            <!--RespuestaLevantamiento, FechaSegundaEtapa-->
                            <div class="col m-3">
                                <label for="RespuestaLevantamiento" class="form-label mb-0">¿Se realiza el
                                    levantamiento?:</label>
                                <textarea name="" id="InputDescripcionSegundaEtapa" class="form-control"
                                    placeholder="OBSERVACIÓN SI PROCEDE O NO EL TRÁMITE SOLICITADO EN LA PRIMERA ETAPA"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </section>
        <!--Tercera etapa-->
        <section style="display: none" id="TerceraEtapa">
            <!--TituloPrimeraEtapa-->
            <div class="card bg-dark bg-opacity-25 rounded-4 rounded-top-0">
                <div class="bg-dark bg-opacity-80 rounded-4 rounded-top-0 mb-3">
                    <div
                        class="card text-center text-white fw-semibold fs-4 bg-info rounded-3 rounded-top-0 p-1 w-100 border-5 border-info mb-3">
                        Tercera etapa
                    </div>
                </div>
            </div>
            <!--FormularioTerceraEtapa-->
            <form id="FormularioPrimeraEtapa" class="container-fluids" action="">
                <!--DocumentosEnPunto, Fecha-->
                <!--TramiteRealizado, Usuario-->
                <div class="row m-2">
                    <!--DocumentosEnPunto, Fecha-->
                    <!--TramiteRealizado, Usuario-->
                    <div class="card col bg-dark text-white bg-opacity-25 rounded-4 me-1">
                        <div class="card bg-dark text-white bg-opacity-80 rounded-3 mx-1 my-3">
                            <!--DocumentosEnPunto, Fecha-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <!--DocumentosEnPunto-->
                                <div class="col">
                                    <label for="SelectDocumentosEnPunto">Documentos en punto:</label>
                                    <select id="SelectDocumentosEnPunto" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <!--Fecha-->
                                <div class="col">
                                    <label for="InputFechaTerceraEtapa">Fecha:</label>
                                    <input type="date" name="" id="InputFechaTerceraEtapa" class="form-control">
                                </div>
                            </div>
                            <!--TramiteRealizado, Usuario-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <!--TramiteRealizado-->
                                <div class="col">
                                    <label for="SelectTramiteRealizado">Trámite realizado:</label>
                                    <select name="" id="SelectTramiteRealizado" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <!--Usuario-->
                                <div class="col">
                                    <label for="SelectUsuario">Usuario:</label>
                                    <select name="" id="SelectUsuario" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--ID, Ficha-->
                <!--Hogar, Orden, TipoDocumento, NumeroDocumento-->
                <div class="row m-2">
                    <!--ID, Ficha-->
                    <!--Hogar, Orden, TipoDocumento, NumeroDocumento-->
                    <div class="card col bg-dark text-white bg-opacity-25 rounded-4 me-1">
                        <div class="card bg-dark text-white bg-opacity-80 rounded-3 mx-1 my-3">
                            <!--ID, Ficha-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <!--ID-->
                                <div class="col">
                                    <label for="InputId">ID:</label>
                                    <input type="number" class="form-control" id="InputId" placeholder="123456789">
                                </div>
                                <!--Ficha-->
                                <div class="col">
                                    <label for="InputFichaTerceeraEtapa">Ficha:</label>
                                    <input type="number" class="form-control" id="InputFichaTerceeraEtapa"
                                        placeholder="12345678901234567890">
                                </div>
                            </div>
                            <!--Hogar, Orden, TipoDocumento, NumeroDocumento-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <!--Hogar-->
                                <div class="col">
                                    <label for="SelectHogarTerceraEtapa">Hogar:</label>
                                    <select id="SelectHogarTerceraEtapa" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <!--Orden-->
                                <div class="col">
                                    <label for="SelectOrdenTerceraEtapa">Orden:</label>
                                    <select id="SelectOrdenTerceraEtapa" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <!--TipoDocumento-->
                                <div class="col">
                                    <label for="SelectTipoDocumento">Tipo documento:</label>
                                    <select id="SelectTipoDocumento" class="form-select">
                                        <option value="">--Seleccione--</option>
                                    </select>
                                </div>
                                <!--NumeroDocumento-->
                                <div class="col">
                                    <label for="InputNumeroDocumentoTerceraEtapa">Numero documento:</label>
                                    <input id="InputNumeroDocumentoTerceraEtapa" type="number" class="form-control"
                                        placeholder="1234567890" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--Descripcción trámite-->
                <div class="row m-2">
                    <div class="card col bg-dark text-white bg-opacity-25 rounded-4 me-1">
                        <div class="card bg-dark text-white bg-opacity-80 rounded-3 mx-1 my-3">
                            <!--Descripcción trámite-->
                            <div class="row d-flex justify-content-center ms-1 me-1 mb-3">
                                <div class="col">
                                    <label for="InputObservacionTerceraEtapa">Observación:</label>
                                    <textarea name="" id="InputObservacionTerceraEtapa" class="form-control"
                                        placeholder="OBSERVACIÓN SI SE REALIZA EL TRÁMITE O NO Y EL MOTIVO"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--BotonGuardarSolicitud-->
                <div class="row m-2">
                    <div class="card col bg-dark text-white bg-opacity-25 rounded-4 me-1">
                        <div class="card bg-dark text-white bg-opacity-80 rounded-3 mx-1 my-3">
                            <div class="row m-2">
                                <div class="col d-flex justify-content-center">
                                    <a href="" class="btn btn-info fw-semibold">Registrar etapa</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
