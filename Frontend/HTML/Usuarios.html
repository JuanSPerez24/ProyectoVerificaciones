      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"

  <main>
    <div class="position-absolute top-0 start-0 w-100 min-vh-100 opacity-25" style="object-fit: cover; z-index: -1;">

    <!--Titulo Buscar-->
    <section>
      <div class="card bg-dark bg-opacity-25 rounded-4">

          </div>
        </div>

                <th class="col">
                  Acciones

              </tr>

            <tbody id="CuerpoTablaUsuarios">
              <!-- Aquí se llenarán los datos dinámicamente -->
            </tbody>
          </table>
