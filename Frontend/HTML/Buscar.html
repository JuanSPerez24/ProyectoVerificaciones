<!DOCTYPE html>

<head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid shadow p-3 mb-2 bg-body-tertiary rounded justify-content-center">
      <a class="navbar-brand" href="/HTML/RegistroYconsulta.html">Logo</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
        aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0" id="ListaPantallas">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/HTML/RegistroYconsulta.html">
              Nuevo registro
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/HTML/Buscar.html">
              Busqueda
            </a>
          </li>
        </ul>
        <button class="navbar-text" id="ButtonCerrarSesion"> Cerrar sesión </button>
      </div>
      <h1 class="position-absolute start-50 translate-middle-x fw-semibold fs-2 m-0 d-none d-lg-block"
        style="z-index: 1">
        Marcas en verificación
      </h1>
    </div>
  </nav>
  <main>
    <img src="/assets/Imagenes/Fondo.jpeg" class="position-fixed top-0 start-0 w-100 h-100" 
        style="object-fit: cover; object-position: center; opacity: 0.25; z-index: -1;" alt="Fondo">
    <!--Titulo Buscar-->
    <section>
      <div class="card bg-dark bg-opacity-25 rounded-4">
        <div class="bg-danger rounded-4 my-3 d-flex justify-content-center">
          <label for="" class="form-label text-white m-2 fs-3 fw-semibold">Buscar</label>
        </div>
      </div>
    </section>
    <section>
      <div class="card bg-dark bg-opacity-25 rounded-4 m-2">
        <div class="bg-dark bg-opacity-80 rounded-4 m-3 d-flex justify-content-center">
          <div class="w-100 mx-3">
            <label for="SelectEstadoBuscar" class="form-label text-white">Estado:</label>
            <div class="input-group mb-3">
              <select name="" id="SelectEstadoBuscar" class="form-select">
                <option value="1">Pendiente</option>
                <option value="2">Respondida</option>
                <option value="3">Realizada</option>
              </select>
              <input type="text" id="TextoBusqueda" class="form-control- w-50" aria-label=""
                placeholder="Texto busqueda" />
              <button id="ButtonBuscar" class="btn btn-outline-danger tw-semibold">
                Buscar
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="card bg-dark bg-opacity-25 rounded-4 m-2">
        <div class="bg-white bg-opacity-80 rounded-4 m-3">
          <div class="table-responsive">
          <table class="table table-striped m-0">
            <thead>
              <tr>
                <th class="col table-success">Fecha</th>
                <th class="col table-success">Ficha</th>
                <th class="col table-success">Punto</th>
                <th class="col table-success">Observación</th>
                <th class="col table-warning">Fecha</th>
                <th class="col table-warning">Observación</th>
                <th class="col table-info">Fecha</th>
                <th class="col table-info">Documentos</th>
                <th class="col table-info">Trámite</th>
                <th class="col table-info">ID</th>
              </tr>
            </thead>
            <tbody id="CuerpoTablaBuscar">
              <!-- Aquí se llenarán los datos dinámicamente -->
            </tbody>
          </table>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script type="module" src="/JS/BusquedaPorTextoYEstado.js"></script>
  <script type="module" src="/JS/CerrarSesion.js"></script>
  <script type="module" src="/JS/VerificacionRol.js"></script>
